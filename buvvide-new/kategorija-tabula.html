<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saplāksnis — BUVVide.lv</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b3a28">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#1d2125;--ink2:#3d444b;--mute:#69717a;--line:#e2e5e7;--line2:#d3d8db;--acc:#008B4D;--acc2:#006e3d;--accbg:#e9f5ef;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geologica,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{width:min(1320px,100% - 32px);margin:0 auto}
.ico{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* header */
.hdr{background:linear-gradient(180deg,#0f4a33,#0b3a28);color:#fff;position:sticky;top:0;z-index:30}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:68px}
.logo img{height:40px;width:auto;display:block}
.search{flex:1;display:flex;align-items:center;gap:8px;height:44px;border:0;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);max-width:620px}
.search input{border:0;outline:0;flex:1;min-width:0;background:none}
.search:focus-within{box-shadow:0 0 0 3px rgba(0,139,77,.45)}
.hdr__r{display:flex;gap:6px;margin-left:auto}
.hbtn{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.cat{background:#fff;color:#0b3a28}.hbtn.cat:hover{background:#e9f5ef}
@media (max-width:760px){.hdr .wrap{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}.search{order:3;flex:1 1 100%;max-width:none}.hbtn .t{display:none}.hbtn{padding:0 10px}}
/* head */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--mute);margin:18px 0 10px}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em}
.chead span{color:var(--mute);font-size:15px}
/* quick filters */
.quick{display:flex;align-items:center;gap:8px;margin:16px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.quick::-webkit-scrollbar{display:none}
.quick b{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;margin-right:4px}
.qchip{flex:0 0 auto;height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.qchip small{color:var(--mute);font-weight:500;margin-left:4px}
.qchip:hover{border-color:var(--ink)}
.qchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.qchip[aria-pressed=true] small{color:#c9cfd4}
/* layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;margin:14px 0 60px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.side__h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.side__h button{border:0;background:none;color:var(--acc2);font-weight:600;font-size:13px;cursor:pointer}
.fg{padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.fg:last-child{border-bottom:0}
.fg h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin-bottom:8px}
.fg label{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:14px;cursor:pointer;line-height:1.3}
.fg label[hidden]{display:none}
.fg label input{width:18px;height:18px;flex:0 0 18px;accent-color:var(--acc);margin-top:1px}
.fg label em{font-style:normal;color:var(--mute);margin-left:auto;padding-left:8px;font-size:13px}
.fg .more{border:0;background:none;color:var(--acc2);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}
.price-in{display:flex;gap:8px;align-items:center}
.price-in input{width:100%;height:40px;border:1.5px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.toolbar .cnt{font-weight:700}
.toolbar .note{font-size:12px;color:var(--mute)}
.sel{height:40px;border:1.5px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff}
.views{display:flex;border:1.5px solid var(--line2);border-radius:9px;overflow:hidden;margin-left:auto}
.views button{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:0;background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.views button[aria-pressed=true]{background:var(--ink);color:#fff}
.fopen{display:none;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:9px;border:0;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.active{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.active button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;cursor:pointer}
.active button:after{content:"✕";font-size:11px;color:var(--mute)}
/* table */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:clip}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:68px;background:#f8f9f8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
thead th.num,td.num{text-align:right}
thead th[data-dir=asc]:after{content:" ▲"}thead th[data-dir=desc]:after{content:" ▼"}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:hover{background:#fafbfa}
td{padding:9px 10px;vertical-align:middle}
td.im{width:66px}
td.im img{width:54px;height:54px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
td.nm a{font-weight:600;line-height:1.3;display:block;max-width:360px}
td.nm a:hover{color:var(--acc2);text-decoration:underline}
td.nm small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.pr{font-weight:800;font-size:16px;white-space:nowrap}
.pm{font-size:13px;color:var(--ink2);white-space:nowrap}
.pm b{font-weight:700}
.qty{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:9px;overflow:hidden;width:max-content}
.qty button{width:32px;height:36px;border:0;background:#fff;font-size:18px;cursor:pointer}
.qty input{width:42px;height:36px;border:0;text-align:center;font-weight:700;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.m2{display:block;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap}
.add{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:9px;border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.add:hover{background:var(--acc2)}
/* cards */
.cards{display:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.view-cards .cards{display:grid}.view-cards .tbl{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:8px}
.card h3{font-size:14px;font-weight:600;line-height:1.3;min-height:3.9em}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:12px;background:var(--bg);border-radius:6px;padding:3px 7px;color:var(--ink2)}
.card .buy{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* mobile */
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);max-height:none;border-radius:0;z-index:60;transform:translateX(-102%);transition:transform .25s}
  .side.on{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .fopen{display:flex}
  .toolbar .note{display:none}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tbody tr{display:grid;grid-template-columns:62px 1fr auto;grid-template-areas:"im nm nm" "im p1 p1" "q q add";gap:6px 10px;padding:12px}
  td{padding:0}
  td.im{grid-area:im}td.nm{grid-area:nm}td.cell-prices{grid-area:p1;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  td.th,td.sz,td.ar{display:none}td.qtd{grid-area:q}td.ad{grid-area:add;align-self:end}
}
@media (min-width:981px){td.cell-prices{display:none}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;transition:transform .3s;z-index:80;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}
</style>
</head>

<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2.2l2.1 10.1a1.6 1.6 0 0 0 1.6 1.3h8.5a1.6 1.6 0 0 0 1.5-1.2L21 8H6.1"/><circle cx="9.6" cy="19.4" r="1.3"/><circle cx="17" cy="19.4" r="1.3"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.6" height="6.6" rx="1"/><rect x="13.4" y="4" width="6.6" height="6.6" rx="1"/><rect x="4" y="13.4" width="6.6" height="6.6" rx="1"/><rect x="13.4" y="13.4" width="6.6" height="6.6" rx="1"/></symbol>
<symbol id="i-table" viewBox="0 0 24 24"><rect x="3.6" y="4.6" width="16.8" height="14.8" rx="1.6"/><path d="M3.6 9.6h16.8M3.6 14.4h16.8M9.4 9.6v9.8"/></symbol>

<header class="hdr"><div class="wrap">
  <a class="logo" href="index.html"><img src="assets/logo.svg" alt="BUVVide.lv" width="108" height="44"></a>
  <a class="hbtn cat" href="katalogs.html"><svg class="ico"><use href="#i-grid"/></svg><span class="t">Katalogs</span></a>
  <form class="search" action="meklet.html" role="search"><svg class="ico"><use href="#i-search"/></svg><input name="q" type="search" placeholder="Meklēt: saplāksnis 18mm, OSB, ID…" aria-label="Meklēt preces"></form>
  <div class="hdr__r">
    <a class="hbtn" href="tel:+37129123476"><svg class="ico"><use href="#i-phone"/></svg><span class="t">29 123 476</span></a>

<main class="wrap">
  <nav class="crumbs" aria-label="Ceļš"><a href="index.html">Sākums</a>›<a href="katalogs.html">Katalogs</a>›<span>Saplāksnis</span></nav>
  <div class="chead"><h1>Saplāksnis</h1><span id="total"></span></div>

  <div class="quick" id="quick" role="group" aria-label="Ātrie filtri pēc biezuma"><b>Biezums:</b></div>

  <div class="layout" id="layout">
    <aside class="side" id="side" aria-label="Filtri">
      <div class="side__h"><span>Filtri</span><button type="button" id="clear">Notīrīt visus</button></div>
      <div id="facets"></div>
    </aside>
    <div>
      <div class="toolbar">
        <button class="fopen" type="button" id="fopen"><svg class="ico"><use href="#i-filter"/></svg>Filtri <span id="fcnt"></span></button>
        <span><span class="cnt" id="count"></span> preces</span>
        <select class="sel" id="sort" aria-label="Kārtot">
          <option value="pop">Kārtot: populārākās</option>
          <option value="pr">Cena: lētākās vispirms</option>
          <option value="ppm">Cena par m²: lētākās</option>
          <option value="th">Biezums: plānākās</option>
        </select>
        <span class="note">Noklusējuma skatu katrai kategorijai iestata admins</span>
        <div class="views" role="group" aria-label="Skats">
          <button type="button" data-v="table" aria-pressed="true"><svg class="ico"><use href="#i-table"/></svg>Tabula</button>
          <button type="button" data-v="cards" aria-pressed="false"><svg class="ico"><use href="#i-grid"/></svg>Kartītes</button>
        </div>
      </div>
      <div class="active" id="active"></div>
      <div class="tbl"><table>
        <thead><tr><th></th><th data-s="n">Nosaukums</th><th data-s="th" class="num">Biezums</th><th>Izmērs, mm</th><th data-s="ar" class="num">Loksne, m²</th><th data-s="ppm" class="num">Cena par m²</th><th data-s="pr" class="num">Cena par loksni</th><th>Daudzums</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="cards" id="cards"></div>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/imgmap.js" defer></script>
<script>
(function(){
  var IMG='https://www.buvvide.lv/userfiles/Image/';
  var FACETS=[['Preces tips','Preces tips'],['Koksne','Koksne'],['VEIDS','Veids'],['šķira','Šķira'],['Klase','Klase']];
  var all=[],sel={},quick=new Set(),sort='pop',view='table',pmin='',pmax='';
  try{view=localStorage.getItem('bvView310')||'table';}catch(e){}
  function prm(x,k){for(var i=0;i<x.prm.length;i++){if(x.prm[i][0]===k)return x.prm[i][1];}return '';}
  function num(s){var m=String(s).replace(',','.').match(/[\d.]+/);return m?parseFloat(m[0]):NaN;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function img(x){var m=window.BV_IMG||{};return m[x.img]||(IMG+x.img);}
  function eur(v){return v.toFixed(2).replace('.',',')+' €';}
  function prep(x){
    var la=prm(x,'Vienas plāksnes laukums'),m=la.match(/([\d.,]+)\s*m2.*?([\d.,]+)\s*€/);
    x.th=num(prm(x,'Biezums'));x.ar=m?parseFloat(m[1].replace(',','.')):NaN;x.ppm=m?parseFloat(m[2].replace(',','.')):(x.ar?x.pr/x.ar:NaN);
    x.sz=[num(prm(x,'Garums')),num(prm(x,'Platums'))].filter(function(v){return !isNaN(v);}).join(' × ');
    x.unit=prm(x,'Pārdošanas vienība')||'gab.';
    return x;
  }
  function pass(x,skip){
    if(quick.size&&!quick.has(x.th))return false;
    for(var k in sel){if(k===skip||!sel[k].size)continue;if(!sel[k].has(prm(x,k)))return false;}
    if(pmin!==''&&x.pr<+pmin)return false;if(pmax!==''&&x.pr>+pmax)return false;
    return true;
  }
  function list(){
    var r=all.filter(function(x){return pass(x);});
    var f={pr:function(a,b){return a.pr-b.pr;},ppm:function(a,b){return (a.ppm||1e9)-(b.ppm||1e9);},th:function(a,b){return (a.th||0)-(b.th||0);},ar:function(a,b){return (a.ar||0)-(b.ar||0);},n:function(a,b){return a.n.localeCompare(b.n,'lv');}}[sort];
    if(f)r=r.slice().sort(f);
    return r;
  }
  function qtyHtml(x){return '<div class="qty"><button type="button" data-d="-1" aria-label="Mazāk">−</button><input type="number" min="1" value="1" aria-label="Daudzums" data-id="'+x.id+'"><button type="button" data-d="1" aria-label="Vairāk">+</button></div><span class="m2" data-m2="'+x.id+'">'+(x.ar?'= '+x.ar.toFixed(2).replace('.',',')+' m²':'')+'</span>';}
  function render(){
    var r=list();
    document.getElementById('count').textContent=r.length;
    document.getElementById('total').textContent=all.length+' preces';
    var rows=r.map(function(x){
      var ppm=isNaN(x.ppm)?'':eur(x.ppm)+'/m²';
      return '<tr><td class="im"><img src="'+esc(img(x))+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'"></td>'
        +'<td class="nm"><a href="prece.html?id='+x.id+'">'+esc(x.n)+'</a><small>ID '+x.id+' · '+esc(x.unit)+'</small></td>'
        +'<td class="num th">'+(isNaN(x.th)?'':x.th+' mm')+'</td><td class="sz">'+esc(x.sz)+'</td>'
        +'<td class="num ar">'+(isNaN(x.ar)?'':x.ar.toFixed(3).replace('.',','))+'</td>'
        +'<td class="num pm">'+(ppm?'<b>'+ppm+'</b>':'')+'</td><td class="num"><span class="pr">'+eur(x.pr)+'</span></td>'
        +'<td class="cell-prices"><span class="pr">'+eur(x.pr)+'</span><span class="pm">'+(ppm?ppm+' · ':'')+(isNaN(x.th)?'':x.th+' mm · ')+esc(x.sz)+'</span></td>'
        +'<td class="qtd">'+qtyHtml(x)+'</td><td class="ad"><button class="add" type="button" data-add="'+x.id+'">Grozā</button></td></tr>';
    }).join('');
    document.getElementById('rows').innerHTML=rows||'<tr><td class="empty" colspan="9">Nav preču ar šiem filtriem. <button class="add" type="button" onclick="document.getElementById(\'clear\').click()">Notīrīt filtrus</button></td></tr>';
    document.getElementById('cards').innerHTML=r.map(function(x){
      return '<article class="card"><img src="'+esc(img(x))+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'"><h3><a href="prece.html?id='+x.id+'">'+esc(x.n)+'</a></h3>'
        +'<div class="tags">'+(isNaN(x.th)?'':'<span>'+x.th+' mm</span>')+(x.sz?'<span>'+esc(x.sz)+'</span>':'')+(isNaN(x.ar)?'':'<span>'+x.ar.toFixed(3).replace('.',',')+' m²</span>')+'</div>'
        +'<div><span class="pr">'+eur(x.pr)+'</span> <span class="pm">/ '+esc(x.unit)+(isNaN(x.ppm)?'':' · <b>'+eur(x.ppm)+'/m²</b>')+'</span></div>'
        +'<div class="buy">'+qtyHtml(x)+'<button class="add" type="button" data-add="'+x.id+'">Grozā</button></div></article>';
    }).join('');
    facets();active();
    document.getElementById('layout').classList.toggle('view-cards',view==='cards');
    [].forEach.call(document.querySelectorAll('.views button'),function(b){b.setAttribute('aria-pressed',b.dataset.v===view?'true':'false');});
  }
  function facets(){
    var h='';
    FACETS.forEach(function(f){
      var k=f[0],cnt={};
      all.forEach(function(x){if(!pass(x,k))return;var v=prm(x,k);if(v)cnt[v]=(cnt[v]||0)+1;});
      var vals=Object.keys(cnt);all.forEach(function(x){var v=prm(x,k);if(v&&!(v in cnt)&&sel[k]&&sel[k].has(v))cnt[v]=0;});
      vals=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
      if(!vals.length)return;
      var open=window['_open_'+k];
      h+='<div class="fg"><h3>'+esc(f[1])+'</h3>'+vals.map(function(v,i){
        var on=sel[k]&&sel[k].has(v);
        return '<label'+(i>=6&&!open&&!on?' hidden':'')+'><input type="checkbox" data-k="'+esc(k)+'" value="'+esc(v)+'"'+(on?' checked':'')+'> <span>'+esc(v.replace(/,\s*$/,''))+'</span><em>'+cnt[v]+'</em></label>';
      }).join('')+(vals.length>6&&!open?'<button class="more" type="button" data-more="'+esc(k)+'">Rādīt visus ('+vals.length+')</button>':'')+'</div>';
    });
    h+='<div class="fg"><h3>Cena par loksni, €</h3><div class="price-in"><input id="pmin" inputmode="decimal" placeholder="no" value="'+esc(pmin)+'"><span>–</span><input id="pmax" inputmode="decimal" placeholder="līdz" value="'+esc(pmax)+'"></div></div>';
    document.getElementById('facets').innerHTML=h;
    var n=quick.size;for(var k in sel)n+=sel[k].size;if(pmin!==''||pmax!=='')n++;
    document.getElementById('fcnt').textContent=n?'('+n+')':'';
  }
  function active(){
    var h='';quick.forEach(function(t){h+='<button type="button" data-rq="'+t+'">'+t+' mm</button>';});
    for(var k in sel)sel[k].forEach(function(v){h+='<button type="button" data-rk="'+esc(k)+'" data-rv="'+esc(v)+'">'+esc(v.replace(/,\s*$/,'').slice(0,40))+'</button>';});
    if(pmin!==''||pmax!=='')h+='<button type="button" data-rp="1">Cena '+(pmin||'0')+'–'+(pmax||'…')+' €</button>';
    document.getElementById('active').innerHTML=h;
  }
  function quickBar(){
    var c={};all.forEach(function(x){if(!isNaN(x.th))c[x.th]=(c[x.th]||0)+1;});
    var q=document.getElementById('quick');
    Object.keys(c).map(Number).sort(function(a,b){return a-b;}).forEach(function(t){
      var b=document.createElement('button');b.type='button';b.className='qchip';b.setAttribute('aria-pressed','false');b.dataset.t=t;
      b.innerHTML=String(t).replace('.',',')+' mm<small>'+c[t]+'</small>';q.appendChild(b);
    });
  }
  function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2200);}
  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.classList.contains('qchip')){var v=+t.dataset.t;quick.has(v)?quick.delete(v):quick.add(v);t.setAttribute('aria-pressed',quick.has(v)?'true':'false');render();}
    else if(t.dataset.v){view=t.dataset.v;try{localStorage.setItem('bvView310',view);}catch(err){}render();}
    else if(t.dataset.more){window['_open_'+t.dataset.more]=1;facets();}
    else if(t.dataset.d){var i=t.parentNode.querySelector('input');i.value=Math.max(1,(+i.value||1)+(+t.dataset.d));upd(i);}
    else if(t.dataset.add){var id=+t.dataset.add,x=all.filter(function(y){return y.id===id;})[0],q=+(t.closest('tr,article').querySelector('.qty input').value)||1;
      toast('Grozā: '+q+' × '+x.unit+(x.ar?' = '+(x.ar*q).toFixed(2).replace('.',',')+' m²':'')+' · '+eur(x.pr*q));}
    else if(t.dataset.rq){quick.delete(+t.dataset.rq);syncQuick();render();}
    else if(t.dataset.rk){sel[t.dataset.rk].delete(t.dataset.rv);render();}
    else if(t.dataset.rp){pmin=pmax='';render();}
    else if(t.id==='clear'){sel={};quick.clear();pmin=pmax='';syncQuick();render();}
    else if(t.id==='fopen'){document.getElementById('side').classList.add('on');}
  });
  document.addEventListener('click',function(e){var s=document.getElementById('side');if(s.classList.contains('on')&&!s.contains(e.target)&&!e.target.closest('#fopen'))s.classList.remove('on');});
  function syncQuick(){[].forEach.call(document.querySelectorAll('.qchip'),function(b){b.setAttribute('aria-pressed',quick.has(+b.dataset.t)?'true':'false');});}
  function upd(i){var id=+i.dataset.id,x=all.filter(function(y){return y.id===id;})[0],q=Math.max(1,+i.value||1),m=document.querySelectorAll('[data-m2="'+id+'"]');
    [].forEach.call(m,function(el){el.textContent=x.ar?'= '+(x.ar*q).toFixed(2).replace('.',',')+' m²':'';});}
  document.addEventListener('change',function(e){var t=e.target;
    if(t.dataset.k){var k=t.dataset.k;sel[k]=sel[k]||new Set();t.checked?sel[k].add(t.value):sel[k].delete(t.value);render();}
    else if(t.id==='sort'){sort=t.value;render();}
    else if(t.id==='pmin'||t.id==='pmax'){pmin=document.getElementById('pmin').value.replace(',','.');pmax=document.getElementById('pmax').value.replace(',','.');render();}
  });
  document.addEventListener('input',function(e){if(e.target.matches('.qty input'))upd(e.target);});
  [].forEach.call(document.querySelectorAll('thead th[data-s]'),function(th){th.addEventListener('click',function(){sort=th.dataset.s;document.getElementById('sort').value=['pr','ppm','th'].indexOf(sort)>=0?sort:'pop';
    [].forEach.call(document.querySelectorAll('thead th'),function(o){o.removeAttribute('data-dir');});th.setAttribute('data-dir','asc');render();});});
  fetch('data/c/310.json').then(function(r){return r.json();}).then(function(d){all=d.items.map(prep);quickBar();render();})
    .catch(function(){document.getElementById('rows').innerHTML='<tr><td class="empty" colspan="9">Neizdevās ielādēt preces.</td></tr>';});
})();
</script>
</body>
</html>
